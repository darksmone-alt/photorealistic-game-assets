name: Import Poly Haven 1K textures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install downloader dependency
        run: python -m pip install requests
      - name: Download 1K JPG PBR maps
        run: python tools/download_polyhaven_textures.py
      - name: Commit downloaded textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textures/polyhaven
          git diff --cached --quiet || git commit -m "Add Poly Haven 1K city PBR textures"
          git push
